<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Sort the Primary Colours</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#f7fbff;color:#1d2a3a}
  button{font:inherit}
  .screen{position:absolute;inset:0;display:none}
  .screen.active{display:flex}

  /* Splash */
  #splash{align-items:center;justify-content:center;background:white;flex-direction:column;gap:18px}
  #splash img{max-width:230px;max-height:120px;object-fit:contain}
  #splash .fallback{font-size:34px;font-weight:800;letter-spacing:.5px}

  /* Game */
  #game{flex-direction:column;padding:12px;gap:10px;background:linear-gradient(#eef8ff,#fff8e8)}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px}
  .title{font-size:clamp(20px,3vw,34px);font-weight:800}
  .status{display:flex;gap:10px;align-items:center;font-weight:700}
  .pill{background:#fff;border:2px solid #d9e6f2;border-radius:999px;padding:8px 14px;white-space:nowrap}
  .instruction{
    text-align:center;background:#fff;border:2px solid #d9e6f2;border-radius:16px;
    padding:8px 12px;font-size:clamp(16px,2.2vw,23px);font-weight:700;
    box-shadow:0 2px 8px rgba(0,0,0,.05)
  }
  .play-area{flex:1;min-height:0;display:grid;grid-template-columns:1.2fr .8fr;gap:12px}
  .objects-panel,.bins-panel{
    background:rgba(255,255,255,.75);border:2px solid #dfeaf3;border-radius:18px;padding:12px;min-height:0
  }
  .objects-panel{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:10px}
  .object{
    border:3px solid transparent;background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;min-width:0;min-height:0;position:relative;box-shadow:0 3px 8px rgba(0,0,0,.08);
    transition:transform .12s,border .12s,opacity .2s
  }
  .object:active{transform:scale(.97)}
  .object.selected{border-color:#222;transform:scale(1.04)}
  .object.done{opacity:.18;pointer-events:none}
  .shape{width:min(72%,92px);height:min(72%,92px);display:block}
  .shape.circle{border-radius:50%}
  .shape.square{border-radius:12px}
  .shape.diamond{transform:rotate(45deg);border-radius:8px;width:min(55%,74px);height:min(55%,74px)}
  .shape.star{clip-path:polygon(50% 0%,61% 34%,98% 35%,68% 56%,79% 91%,50% 70%,21% 91%,32% 56%,2% 35%,39% 34%)}
  .shape.triangle{clip-path:polygon(50% 0,100% 100%,0 100%)}
  .shape.hex{clip-path:polygon(25% 6%,75% 6%,100% 50%,75% 94%,25% 94%,0 50%)}
  .red{background:#e53935}.blue{background:#1976d2}.yellow{background:#fbc02d}

  .bins-panel{display:flex;flex-direction:column;gap:10px;justify-content:center}
  .bin{
    flex:1;min-height:0;border:4px dashed rgba(0,0,0,.18);border-radius:18px;background:#fff;
    display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;font-weight:900;
    font-size:clamp(18px,2.4vw,28px);box-shadow:0 3px 8px rgba(0,0,0,.06)
  }
  .bin .swatch{width:44px;height:44px;border-radius:50%;border:3px solid rgba(0,0,0,.12)}
  .bin.hint{outline:6px solid rgba(76,175,80,.45);animation:pulse .7s infinite alternate}
  @keyframes pulse{to{transform:scale(1.02)}}

  #feedback{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    font-size:82px;font-weight:900;pointer-events:none;opacity:0;transition:opacity .15s,transform .15s;
    text-shadow:0 4px 10px rgba(0,0,0,.15)
  }
  #feedback.show{opacity:1;transform:translate(-50%,-50%) scale(1.1)}

  /* End */
  #end{align-items:center;justify-content:center;flex-direction:column;gap:18px;background:linear-gradient(#eaf7ff,#fff9df);text-align:center;padding:20px}
  #end h1{font-size:clamp(34px,6vw,64px);margin:0}
  #end p{font-size:clamp(20px,3vw,30px);margin:0}
  .play-again{border:0;border-radius:16px;padding:14px 26px;font-size:24px;font-weight:800;background:#222;color:#fff;cursor:pointer}
  .confetti{position:absolute;width:10px;height:16px;top:-20px;animation:fall 2.7s linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  @media (max-width:760px){
    #game{padding:8px}
    .play-area{grid-template-columns:1fr;grid-template-rows:1.2fr .8fr}
    .bins-panel{flex-direction:row}
    .bin{flex-direction:column;gap:4px;font-size:15px}
    .bin .swatch{width:34px;height:34px}
    .objects-panel{grid-template-columns:repeat(4,1fr)}
    .topbar{min-height:42px}
  }
</style>
</head>
<body>

<div id="splash" class="screen active">
  <img src="assets/innovine-logo.png" alt="Innovine logo" onerror="this.style.display='none';document.querySelector('.fallback').style.display='block'">
  <div class="fallback" style="display:none">INNOVINE</div>
</div>

<div id="game" class="screen">
  <div class="topbar">
    <div class="title">Sort the Primary Colours</div>
    <div class="status">
      <div class="pill" id="progress">0 / 12</div>
      <div class="pill" id="score">Score: 0</div>
    </div>
  </div>

  <div class="instruction">Tap a coloured shape, then tap the matching colour basket.</div>

  <div class="play-area">
    <div class="objects-panel" id="objects"></div>

    <div class="bins-panel">
      <button class="bin" data-colour="red" aria-label="Red basket">
        <span class="swatch red"></span><span>RED</span>
      </button>
      <button class="bin" data-colour="blue" aria-label="Blue basket">
        <span class="swatch blue"></span><span>BLUE</span>
      </button>
      <button class="bin" data-colour="yellow" aria-label="Yellow basket">
        <span class="swatch yellow"></span><span>YELLOW</span>
      </button>
    </div>
  </div>
  <div id="feedback"></div>
</div>

<div id="end" class="screen">
  <h1>Excellent!</h1>
  <p id="finalScore"></p>
  <button class="play-again" id="playAgain">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3" preload="auto"></audio>
<audio id="wrongSound" src="assets/wrong.mp3" preload="auto"></audio>
<audio id="clapsSound" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

<script>
(function(){
  var splash = document.getElementById('splash');
  var game = document.getElementById('game');
  var end = document.getElementById('end');
  var objectsEl = document.getElementById('objects');
  var progressEl = document.getElementById('progress');
  var scoreEl = document.getElementById('score');
  var feedback = document.getElementById('feedback');
  var finalScore = document.getElementById('finalScore');
  var selected = null, score = 0, completed = 0, wrongAttempts = 0;

  var colours = ['red','blue','yellow'];
  var shapes = ['circle','square','triangle','diamond','star','hex'];

  function safePlay(id){
    var a = document.getElementById(id);
    if(a){ try{ a.currentTime = 0; a.play().catch(function(){}); }catch(e){} }
  }

  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=arr[i]; arr[i]=arr[j]; arr[j]=t;
    }
    return arr;
  }

  function makeItems(){
    var items = [];
    for(var c=0;c<colours.length;c++){
      for(var n=0;n<4;n++){
        items.push({colour:colours[c], shape:shapes[(c*4+n)%shapes.length]});
      }
    }
    return shuffle(items);
  }

  function build(){
    selected = null; score = 0; completed = 0; wrongAttempts = 0;
    objectsEl.innerHTML = '';
    document.querySelectorAll('.bin').forEach(function(b){b.classList.remove('hint')});
    var items = makeItems();
    items.forEach(function(item,idx){
      var card = document.createElement('button');
      card.className = 'object';
      card.setAttribute('data-colour', item.colour);
      card.setAttribute('aria-label', item.colour + ' shape');
      card.innerHTML = '<span class="shape '+item.shape+' '+item.colour+'"></span>';
      card.addEventListener('click', function(){
        if(card.classList.contains('done')) return;
        document.querySelectorAll('.object').forEach(function(o){o.classList.remove('selected')});
        card.classList.add('selected');
        selected = card;
        wrongAttempts = 0;
        document.querySelectorAll('.bin').forEach(function(b){b.classList.remove('hint')});
      });
      objectsEl.appendChild(card);
    });
    updateStatus();
  }

  function updateStatus(){
    progressEl.textContent = completed + ' / 12';
    scoreEl.textContent = 'Score: ' + score;
  }

  function showFeedback(symbol,good){
    feedback.textContent = symbol;
    feedback.style.color = good ? '#1b9e3e' : '#d32f2f';
    feedback.classList.add('show');
    setTimeout(function(){feedback.classList.remove('show')},500);
  }

  document.querySelectorAll('.bin').forEach(function(bin){
    bin.addEventListener('click', function(){
      if(!selected){
        showFeedback('👆',false);
        return;
      }
      var target = bin.getAttribute('data-colour');
      var actual = selected.getAttribute('data-colour');
      if(target === actual){
        safePlay('correctSound');
        showFeedback('✓',true);
        selected.classList.remove('selected');
        selected.classList.add('done');
        selected = null;
        completed++;
        score++;
        wrongAttempts = 0;
        document.querySelectorAll('.bin').forEach(function(b){b.classList.remove('hint')});
        updateStatus();
        if(completed === 12){
          setTimeout(finish,650);
        }
      } else {
        safePlay('wrongSound');
        showFeedback('✕',false);
        wrongAttempts++;
        if(wrongAttempts >= 2){
          document.querySelectorAll('.bin').forEach(function(b){
            b.classList.toggle('hint', b.getAttribute('data-colour') === actual);
          });
        }
      }
    });
  });

  function finish(){
    game.classList.remove('active');
    end.classList.add('active');
    finalScore.textContent = 'You sorted all 12 shapes correctly!';
    safePlay('clapsSound');
    confetti();
  }

  function confetti(){
    var colors = ['#e53935','#1976d2','#fbc02d'];
    for(var i=0;i<55;i++){
      var d=document.createElement('div');
      d.className='confetti';
      d.style.left=(Math.random()*100)+'vw';
      d.style.background=colors[i%3];
      d.style.animationDelay=(Math.random()*0.8)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      end.appendChild(d);
      setTimeout(function(el){ if(el&&el.parentNode)el.parentNode.removeChild(el); },3600,d);
    }
  }

  document.getElementById('playAgain').addEventListener('click',function(){
    end.classList.remove('active');
    game.classList.add('active');
    build();
  });

  setTimeout(function(){
    splash.classList.remove('active');
    game.classList.add('active');
    build();
  },5000);
})();
</script>
</body>
</html>
